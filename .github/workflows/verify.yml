name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    name: Compatibility verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install compatibility dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify manifest and shipped checksums
        run: python3 scripts/verify_manifest.py
      - name: Exercise reproduction harness failure controls
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Run the reproduction suite
        run: python3 reproduce.py
      - name: Verify decisive raw logs
        run: python3 scripts/verify_decisive_logs.py

  archival:
    name: Recorded archival environment
    # CPython 3.12.3 is unavailable on Ubuntu 26.04 (observed in CI).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.3"
      - name: Install recorded scientific environment
        run: python -m pip install -r requirements-archival.txt
      - name: Verify manifest and shipped checksums
        run: python3 scripts/verify_manifest.py
      - name: Exercise reproduction harness failure controls
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Run fail-closed archival reproduction
        run: python3 reproduce.py --archival
      - name: Verify decisive raw logs
        run: python3 scripts/verify_decisive_logs.py
