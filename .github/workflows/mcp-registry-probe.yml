name: MCP Registry Probe

on:
  pull_request:
    paths:
      - .github/workflows/mcp-registry-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query exact Official MCP Registry records
        shell: bash
        run: |
          set -euo pipefail

          probe() {
            local server_name="$1"
            local version="$2"
            local package_id="$3"
            local slug="$4"
            local encoded_name
            local encoded_version
            local url
            local code

            encoded_name="$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$server_name")"
            encoded_version="$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$version")"
            url="https://registry.modelcontextprotocol.io/v0.1/servers/${encoded_name}/versions/${encoded_version}"
            code="$(curl --silent --show-error --location --output "/tmp/${slug}.json" --write-out '%{http_code}' "$url")"

            echo "===== ${server_name} ${version} ====="
            echo "HTTP ${code}"
            cat "/tmp/${slug}.json"
            echo

            test "$code" = "200"
            jq -e \
              --arg name "$server_name" \
              --arg version "$version" \
              --arg package_id "$package_id" \
              '.server.name == $name
               and .server.version == $version
               and any(.server.packages[]?;
                 .registryType == "pypi"
                 and .identifier == $package_id
                 and .version == $version)' \
              "/tmp/${slug}.json" >/dev/null
          }

          probe "io.github.smaniches/semantic-scholar-mcp" "1.7.1" "s2-mcp-server" "semantic-scholar"
          probe "io.github.smaniches/uniprot-mcp" "1.3.2" "uniprot-mcp-server" "uniprot"
          probe "io.github.smaniches/alphafold-sovereign-mcp" "1.4.3" "alphafold-sovereign-mcp" "alphafold"
