# Keep the pinned dependency floors and CI actions under automated
# security surveillance. Version-update PRs are weekly and low-volume;
# security updates are opened as soon as an advisory publishes.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # This repository contains an immutable requirements-archival.txt that
    # records the exact 2026-06-23 scientific environment. Routine version
    # update PRs must not rewrite that evidence or ratchet compatibility floors.
    # Dependabot security updates remain enabled independently.
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
