# Keep the pinned dependency floors and CI actions under automated
# security surveillance. Routine version-update PRs are disabled;
# security updates remain eligible independently when enabled.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # This repository contains an immutable requirements-archival.txt that
    # records the exact 2026-06-23 scientific environment. Routine version
    # update PRs must not rewrite that evidence or ratchet compatibility floors.
    # Dependabot security updates remain enabled independently.
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Preserve the workflow pins of the research snapshot. Security updates
    # remain separately eligible; only routine version-update PRs are disabled.
    open-pull-requests-limit: 0
